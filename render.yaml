services:
  - type: web
    name: nexchat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
    disk:
      name: nexchat-data
      mountPath: /data
      sizeGB: 1
